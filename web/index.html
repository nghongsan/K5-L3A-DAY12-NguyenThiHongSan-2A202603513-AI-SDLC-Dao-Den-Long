<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đảo Đèn Lồng</title>
<style>
  :root { --sky: #0E1430; --fog: #1B2350; --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --lit: #FFB347; --mote: #FFF6C2; --halo: #FFE58A; --scarf: #C8102E; }
  html, body { margin: 0; height: 100%; background: var(--sky); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { background: rgba(14, 20, 48, .72); border: 1px solid rgba(242, 193, 78, .35); border-radius: 10px; padding: 6px 12px; }
  #hud > * { position: fixed; }
  #hud-flames { top: 12px; left: 12px; font-size: 26px; letter-spacing: 4px; }
  #hud-flames .off { filter: grayscale(1); opacity: .3; }
  #hud-clock { top: 10px; left: 50%; transform: translateX(-50%); font: 700 30px ui-monospace, monospace; }
  #hud-clock.danger { color: var(--danger); animation: blink 1s steps(2) infinite; }
  #hud-tr { top: 12px; right: 12px; text-align: right; min-width: 150px; }
  #hud-tr b { color: var(--lit); }
  #hud-tr .gold { color: var(--gold); font-size: 20px; }
  #hud-motes { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px 10px; }
  #hud-motes i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255, 229, 138, .5); background: rgba(255, 255, 255, .05); }
  #hud-motes i.on { background: radial-gradient(circle, var(--mote) 40%, var(--halo) 75%); box-shadow: 0 0 8px var(--halo); }
  #hud-br { bottom: 14px; right: 14px; display: flex; gap: 10px; align-items: flex-end; }
  .cd { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.1;
        background: conic-gradient(rgba(14,20,48,.85) var(--p, 0%), rgba(242,193,78,.85) 0); border: 2px solid var(--gold); color: var(--text); }
  .cd b { display: block; font-size: 14px; }
  .cd.wait { border-color: #5B5F6E; }
  #hud-charm { color: var(--text); font-size: 12px; }
  #hud-charm span { color: var(--scarf); font-weight: 700; }
  #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); color: var(--lit); }
  #prompt:empty, #windwarn:empty { display: none; }
  #windwarn { top: 56px; left: 50%; transform: translateX(-50%); color: var(--halo); }
  #arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid var(--lit);
           filter: drop-shadow(0 0 6px var(--lit)); display: none; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #fps { position: fixed; bottom: 4px; left: 8px; font: 12px ui-monospace, monospace; opacity: .75; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(14, 20, 48, .78); }
  #overlay[hidden] { display: none; }
  .card { max-width: 560px; margin: 16px; padding: 22px 28px; background: rgba(27, 35, 80, .95); border: 1px solid rgba(242, 193, 78, .5); border-radius: 14px; text-align: center; }
  .card h1 { margin: 0 0 6px; color: var(--lit); font-size: 30px; }
  .card h2 { margin: 0 0 8px; color: var(--gold); }
  .card .quote { font-style: italic; opacity: .9; }
  .card table { margin: 10px auto; text-align: left; border-collapse: collapse; font-size: 14px; }
  .card td { padding: 2px 10px; }
  .card kbd { background: var(--text); color: var(--sky); border-radius: 4px; padding: 0 6px; font: 600 12px ui-monospace, monospace; }
  .card .big { font-size: 24px; color: var(--gold); margin: 8px 0; }
  .card button { display: block; width: 220px; margin: 8px auto; padding: 9px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(14, 20, 48, .8); color: var(--text); font: inherit; cursor: pointer; }
  .card button:hover, .card button:focus { background: var(--gold); color: var(--sky); outline: none; }
  .card label { display: block; margin: 12px 0 4px; }
  .card input[type=range] { width: 260px; }
  @keyframes blink { 50% { opacity: .35; } }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" hidden>
  <div id="hud-flames" class="panel"></div>
  <div id="hud-clock" class="panel">5:00</div>
  <div id="hud-tr" class="panel"><div id="hud-night"></div><div>Đèn <b id="hud-lit">0/5</b></div><div>Điểm <b id="hud-score" class="gold">0</b></div></div>
  <div id="hud-motes" class="panel"></div>
  <div id="hud-br"><div id="hud-charm"></div><div class="cd" id="cd-dash"><div><b>Shift</b>Lướt</div></div><div class="cd" id="cd-pulse"><div><b>F</b>Tỏa Sáng</div></div></div>
  <div id="prompt" class="panel"></div>
  <div id="windwarn" class="panel"></div>
  <div id="arrow"></div>
</div>
<div id="flash"></div>
<div id="fps" hidden></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="/web/main.js"></script>
</body>
</html>
