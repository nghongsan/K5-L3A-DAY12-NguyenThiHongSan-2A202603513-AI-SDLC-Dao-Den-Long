<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đảo Đèn Lồng</title>
<style>
  /* Chữ UI tối thiểu 18 px (1rem) ở 1280×720; tùy chọn "Chữ lớn" nhân 1.25 qua --ui-scale */
  :root { --sky: #0E1430; --fog: #1B2350; --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --lit: #FFB347; --mote: #FFF6C2; --halo: #FFE58A; --scarf: #C8102E; --ui-scale: 1; }
  html { font-size: calc(18px * var(--ui-scale)); }
  html, body { margin: 0; height: 100%; background: var(--sky); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.35; overflow: hidden; user-select: none; }
  body { font-size: 1rem; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { background: rgba(14, 20, 48, .74); border: 1px solid rgba(242, 193, 78, .35); border-radius: 10px; padding: .3rem .7rem; }
  #hud > * { position: fixed; }
  #hud-flames { top: 12px; left: 12px; font-size: 1.5rem; letter-spacing: 4px; }
  #hud-flames .off { filter: grayscale(1); opacity: .3; }
  #hud-clock { top: 10px; left: 50%; transform: translateX(-50%); font: 700 1.7rem ui-monospace, monospace; }
  #hud-clock.danger { color: var(--danger); animation: blink 1s steps(2) infinite; }
  #hud-tr { top: 12px; right: 12px; text-align: right; }
  #hud-tr b { color: var(--lit); }
  #hud-tr .gold { color: var(--gold); font-size: 1.15rem; }
  #hud-motes { bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; padding: .35rem .6rem; }
  #hud-motes i { width: .9rem; height: .9rem; border-radius: 50%; border: 1px solid rgba(255, 229, 138, .5); background: rgba(255, 255, 255, .05); }
  #hud-motes i.on { background: radial-gradient(circle, var(--mote) 40%, var(--halo) 75%); box-shadow: 0 0 8px var(--halo); }
  #hud-motes span { margin-left: .4rem; font-weight: 700; }
  #hud-br { bottom: 12px; right: 12px; display: flex; gap: .5rem; align-items: flex-end; }
  .cd { width: 4.6rem; height: 4.6rem; border-radius: 50%; display: grid; place-items: center; text-align: center; font-size: 1rem; line-height: 1.05;
        background: conic-gradient(rgba(14,20,48,.85) var(--p, 0%), rgba(242,193,78,.85) 0); border: 2px solid var(--gold); color: var(--text); }
  .cd b { display: block; }
  .cd.wait { border-color: #5B5F6E; }
  #hud-charm span { color: var(--scarf); font-weight: 700; }
  #prompt { bottom: 4.2rem; left: 50%; transform: translateX(-50%); color: var(--lit); }
  #prompt:empty, #windwarn:empty { display: none; }
  #windwarn { top: 3.4rem; left: 50%; transform: translateX(-50%); color: var(--halo); }
  #subs { bottom: 7rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .3rem; pointer-events: none; }
  #subs div { background: rgba(14, 20, 48, .85); border: 1px solid var(--text); border-radius: 8px; padding: .2rem .7rem; }
  .arrow { position: fixed; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid var(--lit);
           filter: drop-shadow(0 0 6px var(--lit)); display: none; }
  #shade-arrow { border-bottom-color: #7A3CFF; filter: drop-shadow(0 0 6px #7A3CFF); }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #fps { position: fixed; bottom: 4px; left: 8px; font: 1rem ui-monospace, monospace; opacity: .8; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(14, 20, 48, .78); overflow: auto; }
  #overlay[hidden] { display: none; }
  .card { max-width: 40rem; max-height: 92vh; overflow: auto; margin: 16px; padding: 1rem 1.4rem; background: rgba(27, 35, 80, .96); border: 1px solid rgba(242, 193, 78, .5); border-radius: 14px; text-align: center; }
  .card h1 { margin: 0 0 .3rem; color: var(--lit); font-size: 1.7rem; }
  .card h2 { margin: 0 0 .4rem; color: var(--gold); font-size: 1.25rem; }
  .card .quote { font-style: italic; opacity: .95; }
  .card table { margin: .5rem auto; text-align: left; border-collapse: collapse; }
  .card td, .card th { padding: .1rem .5rem; }
  .card kbd { background: var(--text); color: var(--sky); border-radius: 4px; padding: 0 .35rem; font: 600 1rem ui-monospace, monospace; }
  .card .big { font-size: 1.4rem; color: var(--gold); margin: .4rem 0; }
  .card button { display: block; width: 14rem; margin: .4rem auto; padding: .45rem; border-radius: 8px; border: 1px solid var(--gold); background: rgba(14, 20, 48, .8); color: var(--text); font: inherit; cursor: pointer; }
  .card button.small { display: inline-block; width: auto; margin: 0; padding: .1rem .6rem; }
  .card button:hover, .card button:focus { background: var(--gold); color: var(--sky); outline: none; }
  .card label { display: block; margin: .5rem 0 .2rem; }
  .card input[type=range] { width: 16rem; }
  .card input[type=text] { font: inherit; padding: .3rem .5rem; border-radius: 6px; border: 1px solid var(--gold); background: var(--sky); color: var(--text); width: 12rem; }
  .card .warn { color: var(--danger); min-height: 1.4rem; }
  .card tr.me { color: var(--gold); font-weight: 700; }
  @keyframes blink { 50% { opacity: .35; } }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" hidden>
  <div id="hud-flames" class="panel"></div>
  <div id="hud-clock" class="panel">4:00</div>
  <div id="hud-tr" class="panel"><div id="hud-night"></div><div>Đèn <b id="hud-lit">0/5</b></div><div>Điểm <b id="hud-score" class="gold">0</b></div></div>
  <div id="hud-motes" class="panel"></div>
  <div id="hud-br"><div id="hud-charm"></div><div class="cd" id="cd-dash"><div><b id="cd-dash-key">Shift</b>Lướt</div></div><div class="cd" id="cd-pulse"><div><b id="cd-pulse-key">F</b>Sáng</div></div></div>
  <div id="prompt" class="panel"></div>
  <div id="windwarn" class="panel"></div>
  <div id="subs" aria-live="polite"></div>
  <div id="arrow" class="arrow"></div>
  <div id="shade-arrow" class="arrow"></div>
</div>
<div id="flash"></div>
<div id="fps" hidden></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="/web/main.js"></script>
</body>
</html>
